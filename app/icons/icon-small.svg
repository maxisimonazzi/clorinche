<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Colorines en chiquito (pestaña del navegador, íconos de 16–48 px): sólo la gotita con carita,
       grande y con contorno más grueso, sobre el mismo fondo. El arcoíris, las nubes y los brillitos del
       ícono completo a este tamaño se vuelven manchas, así que acá no van. -->
