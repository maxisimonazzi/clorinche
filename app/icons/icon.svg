    <path d="M256 108C298 172 362 244 362 332a106 106 0 0 1-212 0C150 244 214 172 256 108z" fill="url(#gota)"/>
    <path d="M200 284c5-24 16-44 30-62" fill="none" stroke="#fff" stroke-width="15" opacity=".9"/>
    <ellipse cx="220" cy="334" rx="16" ry="22" fill="#2b2240" stroke="none"/>
    <ellipse cx="292" cy="334" rx="16" ry="22" fill="#2b2240" stroke="none"/>
    <circle cx="226" cy="326" r="6.5" fill="#fff" stroke="none"/>
    <circle cx="298" cy="326" r="6.5" fill="#fff" stroke="none"/>
    <ellipse cx="192" cy="372" rx="17" ry="11" fill="#ffd0e6" stroke="none"/>
    <ellipse cx="320" cy="372" rx="17" ry="11" fill="#ffd0e6" stroke="none"/>
    <path d="M229 370q27 32 54 0z" fill="#2b2240" stroke-width="12"/>
