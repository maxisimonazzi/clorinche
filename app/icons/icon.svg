    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <linearGradient id="gota" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8fd0"/>
      <stop offset="1" stop-color="#ff3d8b"/>
    </linearGradient>
  </defs>
  <rect id="bg" width="512" height="512" rx="112" fill="url(#fondo)"/>
  <g id="motif">
  <g transform="translate(256 258) scale(.9) translate(-256 -258)" stroke="#2b2240" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
