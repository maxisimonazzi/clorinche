      <circle cx="70" cy="410" r="38"/><circle cx="118" cy="390" r="46"/><circle cx="166" cy="418" r="30"/>
      <rect x="44" y="404" width="150" height="46" rx="23"/>
      <circle cx="442" cy="410" r="38"/><circle cx="394" cy="390" r="46"/><circle cx="346" cy="418" r="30"/>
      <rect x="318" y="404" width="150" height="46" rx="23"/>
    </g>
    <g fill="#fff" stroke="none">
      <circle cx="70" cy="410" r="38"/><circle cx="118" cy="390" r="46"/><circle cx="166" cy="418" r="30"/>
      <rect x="44" y="404" width="150" height="46" rx="23"/>
      <circle cx="442" cy="410" r="38"/><circle cx="394" cy="390" r="46"/><circle cx="346" cy="418" r="30"/>
      <rect x="318" y="404" width="150" height="46" rx="23"/>
    </g>
