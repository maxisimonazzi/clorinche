    <path d="M78 66l10 26 26 10-26 10-10 26-10-26-26-10 26-10z" fill="#fff" stroke-width="10"/>
    <path d="M436 70l8 20 20 8-20 8-8 20-8-20-20-8 20-8z" fill="#fff" stroke-width="10"/>
