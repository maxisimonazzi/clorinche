<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vista previa de dibujos (herramienta de desarrollo)</title>
<script src="../../app/js/core/ns.js"></script>
<script src="../../app/js/drawings/registry.js"></script>
<script src="../../app/js/drawings/granja.js"></script>
<script src="../../app/js/drawings/mascotas.js"></script>
<script src="../../app/js/drawings/selva.js"></script>
<script src="../../app/js/drawings/mar.js"></script>
<script>if (location.hash === '#ejemplo') document.write('<script src="ejemplo-pollito.js"><\/script>');</script>
</head>
<body style="margin:0;background:#eee">
<script>
/* Herramienta independiente del motor de la app: rasteriza cada dibujo a 2048 px (igual que el motor),
   calcula zonas cerradas (pared = luminancia < 150, conectividad 4) y pinta cada zona de un color al azar.
   El fondo (zona que toca la esquina) va en celeste pálido fijo: si una parte del dibujo sale celeste
   pálido, esa zona "se escapa" al fondo. Zonas diminutas (< MIN_AREA) quedan blancas (bloqueadas). */
const RES = 2048;
const WALL_LUM = 150;
const MIN_AREA_FRAC = 0.0004;
const BG_COLOR = [214, 240, 255];

function hsl2rgb(h, s, l) {
  s /= 100; l /= 100;
  const k = (n) => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(255 * f(0)), Math.round(255 * f(8)), Math.round(255 * f(4))];
}

async function raster(id) {
  const img = await CL.util.svgToImage(CL.drawings.svg(id, RES));
  const c = CL.util.canvas(RES, RES);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, RES, RES);
  ctx.drawImage(img, 0, 0, RES, RES);
  return c;
}

function regions(ctx, W, H) {
  const d = ctx.getImageData(0, 0, W, H).data;
  const N = W * H;
  const wall = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    const lum = d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114;
    wall[i] = lum < WALL_LUM ? 1 : 0;
  }
  const label = new Int32Array(N).fill(-1);
  const sizes = [];
  const stack = new Int32Array(N);
  let n = 0;
  for (let p = 0; p < N; p++) {
    if (wall[p] || label[p] >= 0) continue;
    let sp = 0, count = 0;
    stack[sp++] = p; label[p] = n;
    while (sp) {
      const q = stack[--sp]; count++;
      const x = q % W;
      if (x > 0 && !wall[q - 1] && label[q - 1] < 0) { label[q - 1] = n; stack[sp++] = q - 1; }
      if (x < W - 1 && !wall[q + 1] && label[q + 1] < 0) { label[q + 1] = n; stack[sp++] = q + 1; }
      if (q >= W && !wall[q - W] && label[q - W] < 0) { label[q - W] = n; stack[sp++] = q - W; }
      if (q < N - W && !wall[q + W] && label[q + W] < 0) { label[q + W] = n; stack[sp++] = q + W; }
    }
    sizes.push(count); n++;
  }
  return { label, sizes, n, wall };
}

/** Devuelve { colored: canvas, stats } */
async function analyze(id, seed = 1) {
  const src = await raster(id);
  const W = RES, H = RES;
  const { label, sizes, n } = regions(src.getContext('2d', { willReadFrequently: true }), W, H);
  const minArea = MIN_AREA_FRAC * W * H;
  const bg = label[2 * W + 2];
  let rnd = seed * 9301 + 49297;
  const r = () => ((rnd = (rnd * 9301 + 49297) % 233280) / 233280);
  const colors = sizes.map((s, i) => {
    if (i === bg) return BG_COLOR;
    if (s < minArea) return [255, 255, 255];
    return hsl2rgb(Math.floor(r() * 360), 60 + r() * 30, 52 + r() * 18);
  });
  const out = CL.util.canvas(W, H);
  const octx = out.getContext('2d');
  const im = octx.createImageData(W, H);
  const od = im.data;
  for (let p = 0; p < W * H; p++) {
    const l = label[p];
    const c = l >= 0 ? colors[l] : [255, 255, 255];
    od[p * 4] = c[0]; od[p * 4 + 1] = c[1]; od[p * 4 + 2] = c[2]; od[p * 4 + 3] = 255;
  }
  octx.putImageData(im, 0, 0);
  octx.globalCompositeOperation = 'multiply';
  octx.drawImage(src, 0, 0);
  octx.globalCompositeOperation = 'source-over';
  const fillable = sizes.filter((s, i) => i !== bg && s >= minArea).length;
  const tiny = sizes.filter((s, i) => i !== bg && s < minArea).length;
  const bgFrac = bg >= 0 ? sizes[bg] / (W * H) : 0;
  return { src, colored: out, stats: { id, regions: n, fillable, tiny, bgFrac: +bgFrac.toFixed(3) } };
}

/** Hoja de contacto: dibujos de una categoría (o todos), coloreados al azar, con nombre. */
window.makeSheet = async ({ cat = null, cell = 420, cols = 4, plain = false, seed = 1 } = {}) => {
  const list = CL.drawings.list(cat || undefined);
  const rows = Math.ceil(list.length / cols) || 1;
  const pad = 14, lab = 40;
  const sheet = CL.util.canvas(cols * (cell + pad) + pad, rows * (cell + pad + lab) + pad);
  const ctx = sheet.getContext('2d');
  ctx.fillStyle = '#f3f0ea'; ctx.fillRect(0, 0, sheet.width, sheet.height);
  const stats = [];
  for (let i = 0; i < list.length; i++) {
    const d = list[i];
    const a = await analyze(d.id, seed + i);
    stats.push(a.stats);
    const x = pad + (i % cols) * (cell + pad), y = pad + Math.floor(i / cols) * (cell + pad + lab);
    ctx.fillStyle = '#fff'; ctx.fillRect(x, y, cell, cell);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(plain ? a.src : a.colored, x, y, cell, cell);
    ctx.fillStyle = '#2b2240'; ctx.font = '600 24px sans-serif';
    ctx.fillText(`${d.name} (${d.id}) · zonas ${a.stats.fillable}`, x + 4, y + cell + 28);
  }
  return { png: sheet.toDataURL('image/png'), stats };
};

/** Un dibujo solo, grande: lado a lado línea y coloreado. */
window.makeSingle = async (id, { size = 900, seed = 7 } = {}) => {
  const a = await analyze(id, seed);
  const c = CL.util.canvas(size * 2 + 30, size + 20);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f3f0ea'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(a.src, 10, 10, size, size);
  ctx.drawImage(a.colored, size + 20, 10, size, size);
  return { png: c.toDataURL('image/png'), stats: a.stats };
};

window.listIds = (cat) => CL.drawings.list(cat || undefined).map((d) => ({ id: d.id, cat: d.cat, name: d.name }));
window.ready = true;
</script>
</body>
</html>
